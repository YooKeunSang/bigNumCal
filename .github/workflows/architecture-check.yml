name: Architecture Guard

on: [pull_request]

jobs:
  check-architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint (커스텀 보안/레이어 규칙)
        run: npm run lint

      - name: Run Architecture Tests (레이어 의존성 검증)
        run: npm run test:architecture
        # 실패 시 PR 머지 불가
